[workspace]
resolver = "3"
members = ["crates/klipp-media", "crates/klipp-recorder", "studio/src-tauri"]

[workspace.package]
version = "0.3.3"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
ffmpeg-sys-next = { version = "8.1.0", default-features = false, features = ["avcodec", "avformat"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.9.8"
windows = "0.62.2"

[profile.release]
lto = "thin"
codegen-units = 1
