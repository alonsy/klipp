[env]
# FFmpeg 8.1 LGPL shared build that ffmpeg-sys-next links against (see docs/BUILDING.md).
FFMPEG_DIR = { value = "vendor/ffmpeg", relative = true }
# libclang for bindgen, from the VS 2022 Build Tools "C++ Clang tools" component.
LIBCLANG_PATH = "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Tools\\Llvm\\x64\\bin"
