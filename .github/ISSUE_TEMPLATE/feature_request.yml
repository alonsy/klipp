name: An idea
description: Something Klipp should do, or do differently.
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Tell us what you'd use it for. The problem matters more than the solution.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: Another app, a workaround, or not at all.
